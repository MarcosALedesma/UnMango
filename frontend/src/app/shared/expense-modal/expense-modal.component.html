@if (modal.isOpen()) {
  <app-dialog
    [title]="modal.editing() ? 'Editar gasto' : 'Registrar gasto'"
    (closed)="modal.close()"
  >
    @if (!modal.editing()) {
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab on" aria-selected="true">Manual</button>
        <button type="button" role="tab" class="tab" disabled title="Disponible en la Fase 2">
          Comprobante
        </button>
      </div>
    }

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="expense-description">Descripción <b class="req">*</b></label>
        <input id="expense-description" formControlName="description" placeholder="Supermercado" />
        @if (form.controls.description.touched && form.controls.description.invalid) {
          <small class="field-error">Ingresá una descripción.</small>
        }
      </div>

      <div class="field">
        <label for="expense-category">Categoría <b class="req">*</b></label>
        <select id="expense-category" formControlName="categoryId">
          @for (c of categories.all(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label for="expense-amount">Monto <b class="req">*</b></label>
        <div class="money">
          <span class="pre">$</span>
          <input
            id="expense-amount"
            type="number"
            step="0.01"
            formControlName="amount"
            placeholder="24850"
          />
          <span class="post">ARS</span>
        </div>
        @if (form.controls.amount.touched && form.controls.amount.invalid) {
          <small class="field-error">El monto debe ser mayor a cero.</small>
        }
      </div>

      <div class="field">
        <label for="expense-date">Fecha <b class="req">*</b></label>
        <input id="expense-date" type="date" formControlName="spentAt" />
      </div>

      <button type="submit" class="cta">
        {{ modal.editing() ? 'Guardar cambios' : 'Guardar' }}
      </button>
    </form>
  </app-dialog>
}
